<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLX | Fuel Dispatch Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #08080a;
    --panel-glass: rgba(18, 18, 22, 0.95);
    --neon: #00f2ff;
    --neon-glow: rgba(0, 242, 255, 0.3);
    --gold: #ffcc00;
    --border: rgba(255, 255, 255, 0.08);
    --text-main: #e0e0e0;
    --text-dim: #808080;
}

* { box-sizing: border-box; transition: all 0.2s ease-in-out; }

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(circle at 2% 2%, rgba(0, 242, 255, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 98% 98%, rgba(255, 204, 0, 0.03) 0%, transparent 20%);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* --- NAVIGATION --- */
nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(10px);
}

.brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--neon);
    display: flex;
    align-items: center;
    gap: 10px;
}

nav ul { display: flex; gap: 30px; list-style: none; }
nav a { 
    text-decoration: none; 
    color: var(--text-dim); 
    font-size: 12px; 
    text-transform: uppercase; 
    letter-spacing: 1px;
}
nav a:hover { color: var(--neon); text-shadow: 0 0 8px var(--neon-glow); }

/* --- HERO --- */
.hero {
    text-align: center;
    padding: 60px 20px 30px;
}

.hero h1 {
    font-size: clamp(24px, 5vw, 42px);
    font-weight: 800;
    letter-spacing: -1px;
    margin: 0;
    background: linear-gradient(to right, #fff, var(--neon));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 10px;
}

/* --- THE PANEL --- */
.panel {
    max-width: 800px;
    width: 95%;
    margin: 20px auto 60px;
    background: var(--panel-glass);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    padding: 40px;
    position: relative;
    overflow: hidden;
}

/* Top accent bar */
.panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 3px;
    background: linear-gradient(90deg, var(--neon), var(--gold));
}

.panel h2 {
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 30px;
    border-left: 4px solid var(--gold);
    padding-left: 15px;
}

/* ORDER ID DISPLAY */
.order-box {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--neon-glow);
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.order-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
}

#liveOrderId {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: var(--neon);
    text-shadow: 0 0 10px var(--neon-glow);
}

/* FORM STYLING */
.grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group { margin-bottom: 20px; }
.full-width { grid-column: span 2; }

label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

input, select, textarea {
    width: 100%;
    padding: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: var(--neon);
    background: rgba(0, 242, 255, 0.02);
}

/* BUTTON */
button {
    width: 100%;
    padding: 18px;
    margin-top: 10px;
    background: var(--neon);
    color: #000;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px var(--neon-glow);
    filter: brightness(1.1);
}

footer {
    margin-top: auto;
    padding: 30px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
}

/* Responsive */
@media (max-width: 600px) {
    .grid-container { grid-template-columns: 1fr; }
    .full-width { grid-column: span 1; }
    nav { padding: 20px; }
    nav ul { display: none; } /* Simplified for mobile */
}
</style>
</head>

<body>

<nav>
    <div class="brand">⚡ KLX REFINERIES</div>
    <ul>
        <li><a href="#">Network</a></li>
        <li><a href="#">Logistics</a></li>
        <li><a href="#">Security</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>FUEL ORDER CONTROL PANEL</h1>
    <p>// ENCRYPTED CONNECTION ESTABLISHED // ACCESS: LEVEL 4</p>
</section>

<section class="panel">
    <h2>Dispatch Authorization</h2>

    <div class="order-box">
        <span class="order-label">TRANSACTION_ID:</span>
        <span id="liveOrderId">INITIALIZING...</span>
    </div>

    <form id="enlistForm">
        <div class="grid-container">
            <div class="form-group">
                <label>Operator Identifier</label>
                <input type="text" name="Operator Name" placeholder="Full Legal Name" required>
            </div>

            <div class="form-group">
                <label>Discord Signature</label>
                <input type="text" name="Discord ID" id="discordInput" placeholder="User#0000" required>
            </div>

            <div class="form-group">
                <label>Fuel Grade</label>
                <select name="Fuel Type">
                    <option>Petrol (87 Octane)</option>
                    <option>Diesel (Low Sulfur)</option>
                    <option>Premium (93 Octane)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Volume (Liters)</label>
                <input type="number" name="Quantity" placeholder="Ex: 5000">
            </div>

            <div class="form-group">
                <label>Destination Zone</label>
                <input type="text" name="Delivery Zone" placeholder="Sector Grid ID">
            </div>

            <div class="form-group">
                <label>Dispatch Urgency</label>
                <select name="Priority">
                    <option>Standard Dispatch</option>
                    <option style="color:var(--gold)">High Priority</option>
                    <option style="color:#ff4444">Emergency Level 1</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Operational Directives</label>
                <textarea name="Instructions" rows="3" placeholder="Enter site-specific access codes or hazards..."></textarea>
            </div>
        </div>

        <button type="submit">CONFIRM & DISPATCH 🚚</button>
    </form>
</section>

<footer>
    &copy; 2026 KLX REFINERIES — DATA ENCRYPTED VIA AES-256 <br>
    SYSTEM_V.4.0.2 // ALL DISPATCHES ARE LOGGED
</footer>

<script>
const discordInput = document.getElementById("discordInput");
const orderDisplay = document.getElementById("liveOrderId");

// Dynamic Order ID Logic
discordInput.addEventListener("input", () => {
    const rawValue = discordInput.value.trim().toUpperCase();
    if(rawValue !== "") {
        // Clean the input to create a cool slug
        const slug = rawValue.replace(/[^A-Z0-9]/g, '-').substring(0, 8);
        orderDisplay.innerText = "KLX-" + slug;
    } else {
        resetID();
    }
});

function resetID() {
    const randomHex = Math.random().toString(16).substring(2, 8).toUpperCase();
    orderDisplay.innerText = "KLX-" + randomHex;
}

// Initial Load
resetID();

// Form Interaction
document.getElementById('enlistForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    const originalText = btn.innerText;
    
    btn.innerText = "SENDING DATA...";
    btn.style.background = "var(--gold)";
    
    setTimeout(() => {
        alert("PROTOCOL SUCCESS: Order " + orderDisplay.innerText + " has been dispatched.");
        btn.innerText = originalText;
        btn.style.background = "var(--neon)";
        this.reset();
        resetID();
    }, 1500);
});
</script>

</body>
</html>
