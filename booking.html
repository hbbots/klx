<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLX | Fuel Dispatch Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
--bg-dark:#08080a;
--panel-glass:rgba(18,18,22,0.95);
--neon:#00f2ff;
--neon-glow:rgba(0,242,255,0.3);
--gold:#ffcc00;
--border:rgba(255,255,255,0.08);
--text-main:#e0e0e0;
--text-dim:#808080;
}

*{box-sizing:border-box;transition:all .2s ease-in-out}

body{
margin:0;
font-family:'Inter',sans-serif;
background-color:var(--bg-dark);
background-image:
radial-gradient(circle at 2% 2%,rgba(0,242,255,0.05)0%,transparent 20%),
radial-gradient(circle at 98% 98%,rgba(255,204,0,0.03)0%,transparent 20%);
color:var(--text-main);
display:flex;
flex-direction:column;
min-height:100vh;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 60px;
border-bottom:1px solid var(--border);
backdrop-filter:blur(10px);
}

.brand{
font-family:'JetBrains Mono',monospace;
font-weight:700;
letter-spacing:2px;
color:var(--neon);
}

nav ul{display:flex;gap:30px;list-style:none}
nav a{text-decoration:none;color:var(--text-dim);font-size:12px;text-transform:uppercase}
nav a:hover{color:var(--neon)}

.hero{text-align:center;padding:60px 20px 30px}

.hero h1{
font-size:42px;
font-weight:800;
background:linear-gradient(to right,#fff,var(--neon));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
margin:0;
}

.hero p{
font-family:'JetBrains Mono',monospace;
color:var(--text-dim);
font-size:14px;
}

.panel{
max-width:800px;
width:95%;
margin:20px auto 60px;
background:var(--panel-glass);
border:1px solid var(--border);
border-radius:16px;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
padding:40px;
position:relative;
}

.panel::before{
content:'';
position:absolute;
top:0;left:0;width:100%;height:3px;
background:linear-gradient(90deg,var(--neon),var(--gold));
}

.panel h2{
font-size:18px;
text-transform:uppercase;
letter-spacing:3px;
color:var(--gold);
margin-bottom:30px;
border-left:4px solid var(--gold);
padding-left:15px;
}

.order-box{
background:rgba(0,0,0,0.4);
border:1px solid var(--neon-glow);
padding:20px;
border-radius:8px;
margin-bottom:35px;
display:flex;
justify-content:space-between;
}

.order-label{
font-family:'JetBrains Mono',monospace;
font-size:12px;
color:var(--text-dim);
}

#liveOrderId{
font-family:'JetBrains Mono',monospace;
font-size:20px;
font-weight:700;
color:var(--neon);
}

.grid-container{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.form-group{margin-bottom:20px}
.full-width{grid-column:span 2}

label{
display:block;
font-size:11px;
color:var(--text-dim);
text-transform:uppercase;
margin-bottom:8px;
}

input,select,textarea{
width:100%;
padding:14px;
background:rgba(255,255,255,0.03);
border:1px solid var(--border);
color:#fff;
border-radius:8px;
font-size:14px;
outline:none;
}

input:focus,select:focus{
border-color:var(--neon);
}

button{
width:100%;
padding:18px;
background:var(--neon);
color:#000;
border:none;
border-radius:8px;
font-weight:700;
letter-spacing:2px;
cursor:pointer;
font-family:'JetBrains Mono',monospace;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 0 25px var(--neon-glow);
}

footer{
margin-top:auto;
padding:30px;
text-align:center;
font-family:'JetBrains Mono',monospace;
font-size:11px;
color:var(--text-dim);
border-top:1px solid var(--border);
}

@media(max-width:600px){
.grid-container{grid-template-columns:1fr}
.full-width{grid-column:span 1}
nav ul{display:none}
}
</style>
</head>

<body>

<nav>
<div class="brand">⚡ KLX REFINERIES</div>
<ul>
<li><a href="#">Network</a></li>
<li><a href="#">Logistics</a></li>
<li><a href="#">Security</a></li>
</ul>
</nav>

<section class="hero">
<h1>FUEL ORDER CONTROL PANEL</h1>
<p>// ENCRYPTED CONNECTION ESTABLISHED //</p>
</section>

<section class="panel">
<h2>Dispatch Authorization</h2>

<div class="order-box">
<span class="order-label">TRANSACTION_ID:</span>
<span id="liveOrderId">INITIALIZING...</span>
</div>

<form id="enlistForm">

<div class="grid-container">

<div class="form-group">
<label>Operator Identifier</label>
<input type="text" name="Operator Name" required>
</div>

<div class="form-group">
<label>Discord Signature</label>
<input type="text" name="Discord ID" id="discordInput" required>
</div>

<div class="form-group">
<label>Fuel Grade</label>
<select name="Fuel Type">
<option>Petrol</option>
<option>Diesel</option>
<option>Premium</option>
</select>
</div>

<div class="form-group">
<label>Volume (Liters)</label>
<input type="number" name="Quantity">
</div>

<div class="form-group">
<label>Destination Zone</label>
<input type="text" name="Delivery Zone">
</div>

<div class="form-group">
<label>Dispatch Urgency</label>
<select name="Priority">
<option>Standard</option>
<option>High Priority</option>
<option>Emergency</option>
</select>
</div>

<div class="form-group full-width">
<label>Operational Directives</label>
<textarea name="Instructions"></textarea>
</div>

</div>

<button type="submit">CONFIRM & DISPATCH 🚚</button>
</form>
</section>

<footer>
© 2026 KLX REFINERIES — ALL DISPATCHES ARE LOGGED
</footer>

<script>
const webhookURL="https://discord.com/api/webhooks/1471097575300923627/dA3VMy5M-41RtoTk47SpByVU7utobBCXufQCc6Le2krEllH5zVs9tMeM2pkBnJ40vbGP";

const discordInput=document.getElementById("discordInput");
const orderDisplay=document.getElementById("liveOrderId");

discordInput.addEventListener("input",()=>{
const raw=discordInput.value.trim().toUpperCase();
if(raw!==""){
const slug=raw.replace(/[^A-Z0-9]/g,'-').substring(0,8);
orderDisplay.innerText="KLX-"+slug;
}else{resetID()}
});

function resetID(){
orderDisplay.innerText="KLX-"+Math.random().toString(16).substring(2,8).toUpperCase();
}
resetID();

document.getElementById("enlistForm").addEventListener("submit",async function(e){
e.preventDefault();

const btn=this.querySelector("button");
btn.innerText="TRANSMITTING...";
btn.style.background="var(--gold)";

const form=new FormData(this);

const message={
content:
`🚚 **NEW FUEL ORDER**

🆔 ${orderDisplay.innerText}
👤 ${form.get("Operator Name")}
💬 ${form.get("Discord ID")}

⛽ ${form.get("Fuel Type")}
📦 ${form.get("Quantity")} L
📍 ${form.get("Delivery Zone")}
⚡ ${form.get("Priority")}

📝 ${form.get("Instructions")||"None"}`
};

await fetch(webhookURL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(message)
});

alert("ORDER SENT: "+orderDisplay.innerText);

this.reset();
resetID();

btn.innerText="CONFIRM & DISPATCH 🚚";
btn.style.background="var(--neon)";
});
</script>

</body>
</html>
