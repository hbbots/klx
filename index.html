<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KLX Dispatch Terminal</title>

<style>
:root{
--bg:#020202;
--panel:#0a0a0a;
--border:#151515;
--neon:#00ffff;
--gold:#ffd700;
--text:#e6e6e6;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}

body{
background:radial-gradient(circle at top,#050505,#000);
color:var(--text);
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#000;
border-bottom:1px solid var(--border);
}

nav ul{
display:flex;
gap:25px;
list-style:none;
}

nav a{
text-decoration:none;
color:#ccc;
font-size:13px;
letter-spacing:1px;
}

nav a:hover{color:var(--neon)}

/* HERO */

.hero{
text-align:center;
padding:70px 20px 40px;
}

.hero h1{
color:var(--neon);
font-size:38px;
letter-spacing:3px;
margin-bottom:10px;
}

.hero p{
opacity:.6;
}

/* TERMINAL CARD */

.wrapper{
max-width:900px;
margin:auto;
padding:20px;
}

.terminal{
background:linear-gradient(145deg,#050505,#000);
border:1px solid var(--border);
border-radius:14px;
padding:35px;
position:relative;
overflow:hidden;
box-shadow:0 0 40px rgba(0,255,255,0.05);
}

/* scan effect */
.terminal::after{
content:"";
position:absolute;
inset:0;
background:linear-gradient(
transparent,
rgba(0,255,255,0.04),
transparent
);
animation:scan 6s linear infinite;
pointer-events:none;
}

@keyframes scan{
0%{transform:translateY(-100%)}
100%{transform:translateY(100%)}
}

/* ORDER ID */

.order-id{
border:1px solid var(--neon);
padding:10px;
text-align:center;
letter-spacing:2px;
color:var(--neon);
margin-bottom:25px;
font-size:13px;
}

/* GRID FORM */

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.full{grid-column:span 2;}

label{
font-size:12px;
opacity:.7;
margin-bottom:6px;
display:block;
}

input,select,textarea{
width:100%;
padding:13px;
background:#000;
border:1px solid #1a1a1a;
border-radius:7px;
color:#fff;
}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:var(--neon);
box-shadow:0 0 10px rgba(0,255,255,0.15);
}

/* SUBMIT */

.submit{
margin-top:25px;
width:100%;
padding:15px;
border:1px solid var(--neon);
background:#000;
color:var(--neon);
letter-spacing:2px;
cursor:pointer;
position:relative;
overflow:hidden;
}

.submit:hover{box-shadow:0 0 15px var(--neon)}

.bar{
position:absolute;
bottom:0;
left:0;
height:4px;
width:0%;
background:var(--neon);
transition:width 1s linear;
}

.submit.loading .bar{width:100%}

footer{
margin-top:40px;
padding:25px;
text-align:center;
font-size:13px;
opacity:.5;
border-top:1px solid var(--border);
}

/* responsive */

@media(max-width:700px){
.grid{grid-template-columns:1fr;}
.full{grid-column:span 1;}
}
</style>
</head>

<body>

<nav>
<div>⚡ KLX REFINERIES</div>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="index.html#about">About</a></li>
<li><a href="index.html#services">Services</a></li>
<li><a href="index.html#leaders">Leaders</a></li>
<li><a href="index.html#gallery">Gallery</a></li>
<li><a href="index.html#contact">Enlist</a></li>
</ul>
</nav>

<section class="hero">
<h1>FUEL DISPATCH TERMINAL</h1>
<p>Authorized KLX Operators — Precision Booking System</p>
</section>

<div class="wrapper">

<form id="enlistForm" class="terminal">

<div class="order-id">
ORDER ID: <span id="liveOrderId">GENERATING...</span>
</div>

<div class="grid">

<div>
<label>Operator Name</label>
<input name="Operator Name" required>
</div>

<div>
<label>Discord ID</label>
<input name="Discord ID" required>
</div>

<div>
<label>Fuel Type</label>
<select name="Fuel Type">
<option>Petrol</option>
<option>Diesel</option>
<option>Premium</option>
</select>
</div>

<div>
<label>Quantity (Litres)</label>
<input type="number" name="Quantity" required>
</div>

<div class="full">
<label>Delivery Zone</label>
<input name="Delivery Zone">
</div>

<div class="full">
<label>Instructions</label>
<textarea name="Instructions"></textarea>
</div>

</div>

<button class="submit">
DISPATCH ORDER
<div class="bar"></div>
</button>

</form>

</div>

<footer>
© 2026 KLX Refineries — Enterprise Dispatch System
</footer>

<script>
const discordInput=document.querySelector('input[name="Discord ID"]');
const orderDisplay=document.getElementById("liveOrderId");

discordInput.addEventListener("input",()=>{
orderDisplay.innerText=discordInput.value?
"KLX-"+discordInput.value:"GENERATING...";
});

document.getElementById("enlistForm")
.addEventListener("submit",(e)=>{
e.preventDefault();
const btn=document.querySelector(".submit");
btn.classList.add("loading");

setTimeout(()=>{
btn.classList.remove("loading");
alert("Order Submitted (Webhook Ready)");
},1500);
});
</script>

</body>
</html>
