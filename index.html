<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLX Fuel Booking</title>

<style>
:root{
--bg:#030303;
--panel:#0a0a0a;
--border:#141414;
--neon:#00ffff;
--gold:#ffd700;
--text:#e6e6e6;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
padding:18px 40px;
border-bottom:1px solid var(--border);
background:#000;
}

nav ul{
display:flex;
gap:25px;
list-style:none;
}

nav a{
text-decoration:none;
color:#ccc;
font-size:14px;
}

nav a:hover{color:var(--neon);}

/* HERO */

.hero{
text-align:center;
padding:80px 20px 40px;
}

.hero h1{
font-size:46px;
letter-spacing:3px;
color:var(--neon);
margin-bottom:10px;
}

/* CONTROL PANEL */

.panel{
max-width:850px;
margin:auto;
background:var(--panel);
border:1px solid var(--border);
padding:35px;
border-radius:10px;
}

.panel h2{
text-align:center;
color:var(--gold);
margin-bottom:20px;
}

.order-box{
border:1px solid var(--neon);
padding:12px;
text-align:center;
color:var(--neon);
margin-bottom:20px;
letter-spacing:2px;
}

.form-group{
margin-bottom:15px;
}

input,select,textarea{
width:100%;
padding:12px;
background:#000;
border:1px solid #1a1a1a;
color:#fff;
border-radius:6px;
}

button{
width:100%;
padding:15px;
background:#000;
border:1px solid var(--neon);
color:var(--neon);
letter-spacing:2px;
cursor:pointer;
}

button:hover{
box-shadow:0 0 12px var(--neon);
}

footer{
margin-top:40px;
padding:25px;
text-align:center;
border-top:1px solid var(--border);
font-size:13px;
opacity:.6;
}
</style>
</head>

<body>

<nav>
<div>⚡ KLX REFINERIES</div>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="index.html#about">About</a></li>
<li><a href="index.html#services">Services</a></li>
<li><a href="index.html#leaders">Leaders</a></li>
<li><a href="index.html#gallery">Gallery</a></li>
<li><a href="index.html#contact">Enlist</a></li>
</ul>
</nav>

<section class="hero">
<h1>⚡ FUEL ORDER CONTROL PANEL</h1>
<p>KLX Industrial Dispatch System — Authorized Operators Only</p>
</section>

<section class="panel">

<h2>Fuel Dispatch Form</h2>

<div class="order-box">
ORDER ID: <span id="liveOrderId">GENERATING...</span>
</div>

<form id="enlistForm">

<div class="form-group">
<input name="Operator Name" placeholder="Operator Name" required>
</div>

<div class="form-group">
<input name="Discord ID" placeholder="Discord ID" required>
</div>

<div class="form-group">
<select name="Fuel Type">
<option>Petrol</option>
<option>Diesel</option>
<option>Premium</option>
</select>
</div>

<div class="form-group">
<input type="number" name="Quantity" placeholder="Quantity (Litres)">
</div>

<div class="form-group">
<input name="Delivery Zone" placeholder="Delivery Zone">
</div>

<div class="form-group">
<select name="Priority">
<option>Standard</option>
<option>High Priority</option>
<option>Emergency</option>
</select>
</div>

<div class="form-group">
<textarea name="Instructions" placeholder="Special Instructions"></textarea>
</div>

<button type="submit">DISPATCH ORDER 🚚</button>

</form>

</section>

<footer>
© 2026 KLX Refineries — Engineered for Excellence
</footer>

<script>

const discordInput=document.querySelector('input[name="Discord ID"]');
const orderDisplay=document.getElementById("liveOrderId");

discordInput.addEventListener("input",()=>{
if(discordInput.value.trim()!==""){
orderDisplay.innerText="KLX-"+discordInput.value.trim();
}else{
orderDisplay.innerText="WAITING...";
}
});

function generateOrderID(){
return "KLX-"+Math.random().toString(36).substring(2,8).toUpperCase();
}

let currentOrderID=generateOrderID();
document.getElementById("liveOrderId").innerText=currentOrderID;

</script>

</body>
</html>
